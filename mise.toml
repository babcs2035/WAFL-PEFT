[tasks]

# ============================================================
# setup: ローカル環境での事前準備
# ============================================================

[tasks."setup:model"]
description = "Hugging Faceベースモデルをローカルキャッシュへダウンロード"
run = """\
MODEL_ID=$(python3 -c "import json; print(json.load(open('config/settings.json'))['model']['model_id'])")
hf download "$MODEL_ID" --local-dir "./cache/models/$MODEL_ID"
"""

[tasks."setup:data"]
description = "GSM8Kデータセットを読み込みNon-IIDシャードとしてdata/train/peer_X.json, data/test/peer_X.jsonに出力"
run = "uv run python src/setup_data.py"

[tasks."setup:contact-pattern"]
description = "Random Waypoint Mobilityシミュレーションでdata/contact_pattern/に接触パターンJSONを生成"
run = "uv run python src/generate_contact_pattern.py"

[tasks."setup:build"]
description = "Dockerイメージwafl-peft:latestをビルド"
depends = ["setup:model", "setup:data"]
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
docker build --build-arg ssh_user="$SSH_USER" --cache-from wafl-peft:latest -t wafl-peft:latest .
"""

[tasks."setup:gpu-nodes"]
description = "各学習デバイスにnvidia-container-toolkitをインストールしDockerのGPUランタイムを設定（冪等）"
run = "uv run python src/setup_gpu_nodes.py"

[tasks.setup]
description = "モデル・データ・イメージのすべてを準備（GPUランタイム設定を含む）"
depends = ["setup:build", "setup:gpu-nodes"]

# ============================================================
# deploy: 階層的物理デプロイ
# ============================================================

[tasks."deploy:sync-local"]
description = "ローカルから管理サーバーへモデル・データ・設定ファイルを転送"
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
MODEL_ID=$(python3 -c "import json; print(json.load(open('config/settings.json'))['model']['model_id'])")
rsync -avz --info=progress2 --exclude='.venv' --exclude='.git' --exclude='__pycache__' --exclude='.gitignore' --exclude='Dockerfile' --exclude='mise.toml' \
  --exclude='cache/' \
  ./ "$SSH_USER@$SERVER_HOST:$DEPLOY_DIR/" \
  --rsync-path="mkdir -p $DEPLOY_DIR && rsync" && \
rsync -az --info=progress2 \
  "cache/models/$MODEL_ID/" \
  "$SSH_USER@$SERVER_HOST:$DEPLOY_DIR/cache/models/$MODEL_ID/" \
  --rsync-path="mkdir -p $DEPLOY_DIR/cache/models/$(echo $MODEL_ID | cut -d/ -f1) && rsync" && \
rsync -az --info=progress2 \
  "cache/datasets/gsm8k/" \
  "$SSH_USER@$SERVER_HOST:$DEPLOY_DIR/cache/datasets/gsm8k/" \
  --rsync-path="mkdir -p $DEPLOY_DIR/cache/datasets/gsm8k && rsync"
"""

[tasks."deploy:registry"]
description = "管理サーバー上のregistryにDockerイメージをpush"
depends = ["deploy:sync-local"]
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
ssh -o StrictHostKeyChecking=no "$SSH_USER@$SERVER_HOST" \
  'export LC_ALL=C; \
   if docker ps --filter name=registry --filter status=running 2>/dev/null | grep -q registry; then \
     echo "Registry already running"; \
   else \
     docker start registry 2>/dev/null || docker run -d -p 127.0.0.1:5000:5000 --name registry registry:2; \
   fi' && \
ssh -f -N -M -S /tmp/wafl-peft-registry-tunnel.sock -L 5000:127.0.0.1:5000 "$SSH_USER@$SERVER_HOST" \
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null && \
sleep 2 && \
DOCKER_MAX_CONCURRENT_UPLOADED_LAYERS=5 docker tag wafl-peft:latest 127.0.0.1:5000/wafl-peft:latest ; \
DOCKER_MAX_CONCURRENT_UPLOADED_LAYERS=5 docker push 127.0.0.1:5000/wafl-peft:latest ; \
push_status=$? ; \
ssh -S /tmp/wafl-peft-registry-tunnel.sock -O exit "$SSH_USER@$SERVER_HOST" 2>/dev/null || true ; \
exit $push_status
"""

[tasks."deploy:distribute"]
description = "管理サーバーから各学習デバイスへDockerイメージを転送しコンテナを起動"
depends = ["deploy:registry"]
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
ssh "$SSH_USER@$SERVER_HOST" \
  "cd $DEPLOY_DIR && python3 src/deploy_distribute.py"
"""

[tasks.deploy]
description = "ローカル->管理サーバー->各学習デバイスへの階層的デプロイ"
depends = ["deploy:distribute"]

[tasks."deploy:eval"]
description = "評価専用ホスト(hosts.eval.txt)へregistry pullでimageを配布し、ベースモデル・GSM8Kデータセットも同期する（mise deploy 実行後に行う。registryが起動済みである必要がある）"
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
ssh "$SSH_USER@$SERVER_HOST" \
  "cd $DEPLOY_DIR && python3 src/deploy_distribute.py eval"
"""

[tasks.clean]
description = "ローカル(cache,.venv,data)+全ノードのDockerコンテナ・イメージ・デプロイディレクトリを削除"
run = "uv run python src/clean.py"

# ============================================================
# start: 実験の一斉実行
# ============================================================

[tasks."start:server"]
description = "管理サーバー上でserver.pyをコンテナ起動（グローバルモデル収束性能のリアルタイム評価スレッドを含む）"
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
ssh "$SSH_USER@$SERVER_HOST" \
  "export LC_ALL=C && mkdir -p $DEPLOY_DIR/logs $DEPLOY_DIR/results && chown $SSH_USER:$SSH_USER $DEPLOY_DIR/logs $DEPLOY_DIR/results && docker rm -f wafl-peft-server 2>/dev/null || true; docker run -d --name wafl-peft-server --gpus all --net=host -v /home/$SSH_USER/.ssh:/home/$SSH_USER/.ssh:ro -v $DEPLOY_DIR/src:/app/src -v $DEPLOY_DIR/config:/app/config -v $DEPLOY_DIR/data:/app/data -v $DEPLOY_DIR/cache:/app/cache -v $DEPLOY_DIR/logs:/app/logs -v $DEPLOY_DIR/results:/app/results 127.0.0.1:5000/wafl-peft:latest /app/.venv/bin/python src/server.py"
"""

[tasks."start:clients"]
description = "管理サーバーから全デバイスへ並列SSHでコンテナ起動（WAFL_P2P_ENABLED/WAFL_SELF_EVAL/WAFL_P2P_SYNC/WAFL_P2P_SYNC_TIMEOUT_SEC をサーバー側へ転送）"
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
# ベースライン実験用フラグ・Iter12同期バリアフラグをサーバー側の start_clients.py へ
# 明示的に転送する（SSH は既定で環境変数を伝播しないため、インラインで渡す。
# WAFL_P2P_SYNC 未指定なら 0=従来の非同期経路。WAFL_P2P_SYNC_TIMEOUT_SEC 未指定なら
# 空文字を渡し、start_clients.py 側で config/settings.json の既定値へフォールバックする）。
ssh "$SSH_USER@$SERVER_HOST" \
  "cd $DEPLOY_DIR && WAFL_P2P_ENABLED=${WAFL_P2P_ENABLED:-1} WAFL_SELF_EVAL=${WAFL_SELF_EVAL:-1} WAFL_P2P_SYNC=${WAFL_P2P_SYNC:-0} WAFL_P2P_SYNC_TIMEOUT_SEC=${WAFL_P2P_SYNC_TIMEOUT_SEC:-} WAFL_MERGE_INCLUDE_SELF=${WAFL_MERGE_INCLUDE_SELF:-1} python3 src/start_clients.py"
"""

[tasks.start]
description = "管理サーバーと全学習デバイスを起動し、実験を開始（グローバル収束性能のリアルタイム監視を含む）"
depends = ["start:server", "start:clients"]

[tasks."start:eval"]
description = "評価専用ホスト(hosts.eval.txt)でeval_workerコンテナを起動し、学習中からcheckpointを随時評価する"
run = """\
SSH_USER=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; print(json.load(open('config/settings.json'))['server']['server_host'])")
DEPLOY_DIR=$(python3 -c "import json; print(json.load(open('config/settings.json'))['deployment']['deploy_dir'])")
ssh "$SSH_USER@$SERVER_HOST" \
  "cd $DEPLOY_DIR && python3 src/start_eval_workers.py"
"""

# ============================================================
# analyze: データ回収と評価
# ============================================================

[tasks."analyze:collect"]
description = "各学習デバイスからメトリクスログとLoRA重みチェックポイントを回収"
run = """\
SETTINGS="config/settings.json"
DEPLOY_DIR=$(python3 -c "import json; c=json.load(open('$SETTINGS')); print(c['deployment']['deploy_dir'])")
SSH_USER=$(python3 -c "import json; c=json.load(open('$SETTINGS')); print(c['deployment']['ssh_user'])")
SERVER_HOST=$(python3 -c "import json; c=json.load(open('$SETTINGS')); print(c['server']['server_host'])")
mkdir -p results
# 実験ディレクトリ名はメタファイルではなく、collect_logs.py自身の標準出力
# （__EXPERIMENT_DIR__:プレフィックス行）から取得する。実験ディレクトリの
# 実体はserver.pyが実験開始時に一度だけresults/下に作成したものを
# collect_logs.pyがそのまま検出するため、ここで独自にタイムスタンプを
# 生成・保存する必要がない
ssh "$SSH_USER@$SERVER_HOST" "cd $DEPLOY_DIR && python3 src/collect_logs.py" | tee /tmp/collect_output.txt
EXPERIMENT_DIR=$(grep '^__EXPERIMENT_DIR__:' /tmp/collect_output.txt | cut -d: -f2)
if [ -z "$EXPERIMENT_DIR" ]; then
  echo "ERROR: collect_logs.py の出力から実験ディレクトリ名を取得できませんでした" >&2
  exit 1
fi
rsync -az "$SSH_USER@$SERVER_HOST:$DEPLOY_DIR/results/$EXPERIMENT_DIR/" "results/$EXPERIMENT_DIR/"
"""

[tasks."analyze:evaluate"]
description = "回収した全データをマージし、評価グラフを自動レンダリング"
depends = ["analyze:collect"]
run = "uv run python src/analyze.py"

[tasks.analyze]
description = "ログ回収と自動評価"
depends = ["analyze:collect", "analyze:evaluate"]
